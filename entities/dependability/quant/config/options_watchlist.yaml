#   ref_price         — recent reference price at the time of the call (kept for audit)
#   target            — upside objective for the long-call structure
#   move_pct          — % move required from ref_price to target
#   probability       — % chance of touching target within the timing window (Mike's estimate)
#   timing            — human-readable time window (e.g., "4-10 weeks; Oct-mid Nov")
#   timing_min_weeks  — lower bound of timing window (for sorting/filtering)
#   timing_max_weeks  — upper bound of timing window
#   trigger           — read-through / catalyst (what needs to happen for the move)
#   rank              — preference order (1 = top pick)
#   rank_reason       — why this rank
#   risk_line         — price below which the bullish thesis fails
#   risk_meaning      — what a break of risk_line means for the trade

