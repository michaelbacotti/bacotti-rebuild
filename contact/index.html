<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Contact | Bacotti Inc.</title>
 <meta name="description" content="Contact Bacotti Inc. — a private family office.">
 <link rel="stylesheet" href="/style.css">
</head>
<body>
 <div id="site-nav"></div>
 <main>
  <div class="page-content">
   <h1>Contact</h1>

   <p>Bacotti Inc. is a private family office. We do not accept unsolicited inquiries, solicitations, or cold outreach. For legitimate matters, reach us at the address below.</p>

   <p>Email: <a href="mailto:stewardship@bacotti.com">stewardship@bacotti.com</a></p>

   <form class="contact-form" action="#" method="post">
    <div class="form-group">
     <label for="name">Name</label>
     <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
     <label for="email">Email</label>
     <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
     <label for="message">Message</label>
     <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit" class="btn">Send</button>
   </form>
  </div>
 </main>
 <div id="site-footer"></div>
 <script src="/nav.js"></script>
 <script src="/footer.js"></script>
</body>
</html>
